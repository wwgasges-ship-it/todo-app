<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#23634e"><meta name="description" content="하루를 가볍게 정리하는 나만의 할 일 목록"><title>차곡 — 나의 할 일</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><main class="app"><header><a class="brand" href="./" aria-label="차곡 처음으로"><span class="logo" aria-hidden="true">✓</span> 차곡<span class="brand-sub">나의 작은 실천</span></a><span class="local-badge">내 기기에 저장</span></header>
<section class="intro"><p id="date" class="eyebrow"></p><h1>하나씩, 차곡차곡.</h1><p class="subtitle">작은 실천으로 채워가는 나의 하루</p></section>
<section class="progress-card" aria-label="할 일 진행 현황"><div><span class="eyebrow">나의 진행 상황</span><p id="progress-text">가볍게 시작해 볼까요?</p></div><div id="progress-count" class="count">0<span> / 0</span></div><progress id="progress" value="0" max="1" aria-label="할 일 완료율"></progress><span id="encouragement" class="hint">오늘의 작은 할 일을 적어보세요.</span></section>
<form id="add-form"><label for="task-input">새로운 할 일</label><div class="input-row"><input id="task-input" name="task" placeholder="어떤 일을 해볼까요?" maxlength="200" autocomplete="off" required><button type="submit" class="add-button"><span aria-hidden="true">＋</span> 추가</button></div><p class="hint">엔터 키로도 추가할 수 있어요.</p></form>
<section class="tasks-section" aria-label="할 일 목록"><div class="list-toolbar"><div class="filters" role="group" aria-label="할 일 필터"><button type="button" data-filter="all" aria-pressed="true">전체 <span id="all-count">0</span></button><button type="button" data-filter="active" aria-pressed="false">진행 중</button><button type="button" data-filter="done" aria-pressed="false">완료</button></div><span id="remaining" class="hint"></span></div><ul id="task-list"></ul><div id="empty" class="empty"><span class="empty-icon" aria-hidden="true">✓</span><h2 id="empty-title">새로운 시작을 기다리고 있어요</h2><p id="empty-description">작은 일 하나부터 추가해 보세요.</p></div></section>
<footer>나만의 속도로, 하나씩 해내면 충분해요.<p>목록은 이 브라우저에만 저장돼요.</p></footer><div id="notice" class="notice" role="status" aria-live="polite" hidden><span id="notice-text"></span><button id="undo" type="button" hidden>삭제 취소</button></div></main></body></html>
